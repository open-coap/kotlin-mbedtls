version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      gradle:
        patterns:
          - "*"
        # detekt and ktlint upgrades usually require fixing new findings, keep them in a separate PR
        exclude-patterns:
          - "dev.detekt*"
          - "io.gitlab.arturbosch.detekt*"
          - "org.jlleitschuh.gradle.ktlint*"
        # the build targets JVM 8, so major bumps need a compatibility check of their own
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
