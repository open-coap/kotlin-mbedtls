# Version of the `mbedtls-lib` module, holding precompiled mbedtls binaries.
# It is deliberately decoupled from the version of the kotlin modules, so that the (rarely
# changing) native binaries are published only when they are actually rebuilt.
#
# Format: <mbedtls-version>.<packaging-revision>
# Bump the packaging revision whenever binaries are recompiled for an unchanged mbedtls version,
# published versions are immutable on Maven Central.
mbedtlsLibVersion=4.2.0.0

# `<mbedtlsLibVersion>:<sha256>` of the binaries in `mbedtls-lib/bin`, verified by the `check` task.
# The version it was recorded for ensures `mbedtlsLibVersion` is bumped whenever binaries change.
# Calculate the hash with:
#   (cd mbedtls-lib/bin && find * -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
mbedtlsLibBinariesSha256=4.2.0.0:e13ae41c35c1a85bb0826a8fda6960ceecf5c3e3ab1272c23158a1aad6988585
